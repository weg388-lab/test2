<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碼表 V2</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: #f5f7fa;
  }

  .stopwatch {
    width: min(90vw, 460px);
    min-height: 680px;
    padding: 55px 25px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 3px solid #d9e0e3;
    border-radius: 30px;
    background: #f9fafb;
    box-shadow:
      8px 8px 18px rgba(160, 170, 175, 0.22),
      -6px -6px 14px rgba(255, 255, 255, 0.9);
  }

  .timer-ring {
    position: relative;
    width: min(72vw, 330px);
    height: min(72vw, 330px);
    border-radius: 50%;
    background: conic-gradient(
      from -90deg,
      #48cbb6,
      #1c9cf6,
      #0e7ed2,
      #48cbb6
    );
    padding: 16px;
    box-shadow: 0 8px 18px rgba(28, 156, 246, 0.18);
  }

  .timer-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #f9fafb;
  }

  #display {
    color: #333333;
    font-size: clamp(2.8rem, 10vw, 4.3rem);
    font-weight: 300;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .controls {
    width: min(100%, 260px);
    margin-top: 65px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  button {
    width: 100%;
    height: 64px;
    border: none;
    border-radius: 999px;
    color: #ffffff;
    font-size: 1.45rem;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.2s ease;
  }

  button:hover:not(:disabled) {
    transform: translateY(-2px);
  }

  button:active:not(:disabled) {
    transform: translateY(1px);
  }

  #startBtn {
    background: #006071;
    box-shadow: 0 8px 18px rgba(0, 163, 181, 0.35);
  }

  #resetBtn {
    background: #999999;
    box-shadow: 0 6px 14px rgba(80, 80, 80, 0.15);
  }

  button:disabled {
    cursor: not-allowed;
    opacity: 0.45;
    box-shadow: none;
  }

  @media (max-width: 420px) {
    .stopwatch {
      min-height: 600px;
      padding-top: 45px;
      border-radius: 26px;
    }

    .controls {
      margin-top: 55px;
    }
  }
</style>
</head>

<body>
  <main class="stopwatch">
    <div class="timer-ring">
      <div class="timer-inner">
        <div id="display">00:00.00</div>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn">開始</button>
      <button id="resetBtn" disabled>重設</button>
    </div>
  </main>

<script>
  const display = document.getElementById("display");
  const startBtn = document.getElementById("startBtn");
  const resetBtn = document.getElementById("resetBtn");

  let startTime = 0;
  let elapsedTime = 0;
  let timerId = null;
  let isRunning = false;

  function formatTime(milliseconds) {
    const totalCentiseconds = Math.floor(milliseconds / 10);
    const centiseconds = totalCentiseconds % 100;
    const totalSeconds = Math.floor(totalCentiseconds / 100);
    const seconds = totalSeconds % 60;
    const minutes = Math.floor(totalSeconds / 60);

    return (
      String(minutes).padStart(2, "0") + ":" +
      String(seconds).padStart(2, "0") + "." +
      String(centiseconds).padStart(2, "0")
    );
  }

  function updateDisplay() {
    const currentElapsed = isRunning
      ? elapsedTime + (performance.now() - startTime)
      : elapsedTime;

    display.textContent = formatTime(currentElapsed);
  }

  function tick() {
    updateDisplay();
    timerId = requestAnimationFrame(tick);
  }

  function startTimer() {
    isRunning = true;
    startTime = performance.now();
    startBtn.textContent = "暫停";
    resetBtn.disabled = false;
    timerId = requestAnimationFrame(tick);
  }

  function pauseTimer() {
    elapsedTime += performance.now() - startTime;
    isRunning = false;
    cancelAnimationFrame(timerId);
    startBtn.textContent = "繼續";
    updateDisplay();
  }

  function resetTimer() {
    cancelAnimationFrame(timerId);
    elapsedTime = 0;
    startTime = 0;
    isRunning = false;
    display.textContent = "00:00.00";
    startBtn.textContent = "開始";
    resetBtn.disabled = true;
  }

  startBtn.addEventListener("click", () => {
    if (isRunning) {
      pauseTimer();
    } else {
      startTimer();
    }
  });

  resetBtn.addEventListener("click", resetTimer);
</script>
</body>
</html>
