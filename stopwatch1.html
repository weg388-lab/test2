<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡碼表 Stopwatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333333;
        }

        /* 外部容器卡片 */
        .stopwatch-card {
            background-color: #F5F7FA;
            width: 320px;
            padding: 36px 24px 32px 24px;
            border-radius: 28px;
            border: 1.5px solid #E1E1E1;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        /* 圓形進度條區塊 */
        .timer-display-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .progress-ring {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 0.05s linear;
            transform-origin: 50% 50%;
        }

        /* 時間顯示文字 */
        .time-text {
            position: absolute;
            font-size: 32px;
            font-weight: 500;
            letter-spacing: -0.5px;
            color: #333333;
            font-variant-numeric: tabular-nums;
        }

        /* 控制按鈕區塊 */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
        }

        .btn {
            width: 160px;
            height: 48px;
            border-radius: 24px;
            border: none;
            font-size: 16px;
            font-weight: 500;
            font-family: 'Noto Sans TC', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        /* 開始/暫停/繼續 按鈕 */
        .btn-primary {
            background-color: #006071;
            color: #FFFFFF;
            box-shadow: 0 4px 14px rgba(0, 163, 181, 0.35);
        }

        .btn-primary:hover {
            background-color: #004d5b;
            box-shadow: 0 6px 18px rgba(0, 163, 181, 0.45);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* 重設按鈕 */
        .btn-secondary {
            background-color: #999999;
            color: #FFFFFF;
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: #808080;
        }

        .btn-secondary:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="stopwatch-card">
        <!-- 圓形進度條與時間顯示 -->
        <div class="timer-display-container">
            <svg class="progress-ring" viewBox="0 0 120 120">
                <defs>
                    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#48CBB6" />
                        <stop offset="50%" stop-color="#1C9CF6" />
                        <stop offset="100%" stop-color="#0E7ED2" />
                    </linearGradient>
                </defs>
                <!-- 底環 -->
                <circle
                    stroke="#EAEFF5"
                    stroke-width="5"
                    fill="transparent"
                    r="52"
                    cx="60"
                    cy="60"
                />
                <!-- 進度環 -->
                <circle
                    class="progress-ring__circle"
                    stroke="url(#ringGradient)"
                    stroke-width="5"
                    stroke-linecap="round"
                    fill="transparent"
                    r="52"
                    cx="60"
                    cy="60"
                />
            </svg>
            <div class="time-text" id="display">00:00.00</div>
        </div>

        <!-- 按鈕區 -->
        <div class="controls">
            <button class="btn btn-primary" id="startPauseBtn">開始</button>
            <button class="btn btn-secondary" id="resetBtn" disabled>重設</button>
        </div>
    </div>

    <script>
        // DOM 元素
        const display = document.getElementById('display');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const circle = document.querySelector('.progress-ring__circle');

        // SVG 圓環周長計算
        const radius = circle.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;

        circle.style.strokeDasharray = `${circumference} ${circumference}`;
        circle.style.strokeDashoffset = circumference;

        // 狀態變數
        let timer = null;
        let startTime = 0;
        let elapsedTime = 0;
        let isRunning = false;

        // 設定圓環進度 (0 ~ 1)
        function setProgress(percent) {
            const offset = circumference - (percent * circumference);
            circle.style.strokeDashoffset = offset;
        }

        // 格式化時間 (毫秒 -> MM:SS.ss)
        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const milliseconds = Math.floor((ms % 1000) / 10);

            const pad = (num, size = 2) => String(num).padStart(size, '0');

            return `${pad(minutes)}:${pad(seconds)}.${pad(milliseconds)}`;
        }

        // 更新畫面
        function updateDisplay() {
            const currentTime = Date.now();
            const timePassed = elapsedTime + (currentTime - startTime);
            display.textContent = formatTime(timePassed);

            // 每 60 秒跑完一圈圓環
            const progress = (timePassed % 60000) / 60000;
            setProgress(progress);
        }

        // 開始 / 暫停 / 繼續 事件處理
        startPauseBtn.addEventListener('click', () => {
            if (!isRunning) {
                // 開始 / 繼續
                startTime = Date.now();
                timer = setInterval(updateDisplay, 10);
                isRunning = true;

                startPauseBtn.textContent = '暫停';
                resetBtn.disabled = false;
            } else {
                // 暫停
                clearInterval(timer);
                elapsedTime += Date.now() - startTime;
                isRunning = false;

                startPauseBtn.textContent = '繼續';
            }
        });

        // 重設事件處理
        resetBtn.addEventListener('click', () => {
            clearInterval(timer);
            timer = null;
            startTime = 0;
            elapsedTime = 0;
            isRunning = false;

            display.textContent = '00:00.00';
            setProgress(0);

            startPauseBtn.textContent = '開始';
            resetBtn.disabled = true;
        });
    </script>
</body>
</html>
